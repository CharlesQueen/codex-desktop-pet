<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img"><title>持续隐藏与退出行为示意</title><rect width="1280" height="620" rx="22" fill="#f7f8fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="49" font-size="30" fill="#17233b" font-weight="650" >隐藏与退出，由你决定何时恢复</text><text x="40" y="84" font-size="18" fill="#62718a" font-weight="400" >0.2.2 · 行为示意：工作联动不会覆盖你的选择</text><text x="60" y="126" font-size="15" fill="#62718a" font-weight="600" >你的操作</text><text x="362" y="126" font-size="15" fill="#62718a" font-weight="600" >之后发生</text><text x="802" y="126" font-size="15" fill="#62718a" font-weight="600" >保持状态与恢复方式</text><rect x="40" y="146" width="260" height="178" rx="18" fill="#eef5ff" stroke="#ccddf4"/><rect x="340" y="146" width="400" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><rect x="780" y="146" width="460" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><path d="M310 235h20m-7-6 7 6-7 6 M750 235h20m-7-6 7 6-7 6" fill="none" stroke="#929db0" stroke-width="2"/><text x="60" y="188" font-size="25" fill="#2866ad" font-weight="650" >持续隐藏</text><text x="60" y="228" font-size="18" fill="#24324a" font-weight="400" >浮窗隐藏，托盘保留</text><text x="60" y="261" font-size="17" fill="#62718a" font-weight="400" >保存隐藏选择</text><text x="362" y="189" font-size="20" fill="#24324a" font-weight="400" >工作状态变化</text><text x="362" y="229" font-size="20" fill="#24324a" font-weight="400" >新会话建立连接</text><text x="362" y="269" font-size="20" fill="#24324a" font-weight="400" >Codex 重启或重新连接</text><text x="802" y="188" font-size="23" fill="#2866ad" font-weight="650" >仍然隐藏，不自行弹出</text><text x="802" y="228" font-size="18" fill="#24324a" font-weight="400" >点击托盘图标或选择“显示桌宠”</text><text x="802" y="264" font-size="18" fill="#24324a" font-weight="400" >也可运行 pnpm desktop:start</text><rect x="40" y="358" width="260" height="178" rx="18" fill="#f6effc" stroke="#e0d1ef"/><rect x="340" y="358" width="400" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><rect x="780" y="358" width="460" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><path d="M310 447h20m-7-6 7 6-7 6 M750 447h20m-7-6 7 6-7 6" fill="none" stroke="#929db0" stroke-width="2"/><text x="60" y="400" font-size="25" fill="#7852a4" font-weight="650" >退出桌宠</text><text x="60" y="440" font-size="18" fill="#24324a" font-weight="400" >关闭浮窗与托盘进程</text><text x="60" y="473" font-size="17" fill="#62718a" font-weight="400" >保存退出选择</text><text x="362" y="401" font-size="20" fill="#24324a" font-weight="400" >工作状态变化</text><text x="362" y="441" font-size="20" fill="#24324a" font-weight="400" >新会话建立连接</text><text x="362" y="481" font-size="20" fill="#24324a" font-weight="400" >Codex 重启或重新连接</text><text x="802" y="400" font-size="23" fill="#7852a4" font-weight="650" >仍然退出，不自动启动</text><text x="802" y="440" font-size="18" fill="#24324a" font-weight="400" >手动运行以下命令恢复：</text><text x="802" y="476" font-size="18" fill="#24324a" font-weight="400" font-family="Consolas,monospace">pnpm desktop:start</text><text x="40" y="582" font-size="17" fill="#62718a" font-weight="400" >主动执行安装或更新也会打开桌宠。</text></g></svg>