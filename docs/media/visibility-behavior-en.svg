<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img"><title>Hide and exit behavior diagram</title><rect width="1280" height="620" rx="22" fill="#f7f8fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="49" font-size="30" fill="#17233b" font-weight="650" >Hide and exit: reopen only when you choose</text><text x="40" y="84" font-size="18" fill="#62718a" font-weight="400" >0.2.2 · Behavior diagram: work activity respects your choice</text><text x="60" y="126" font-size="15" fill="#62718a" font-weight="600" >YOUR ACTION</text><text x="362" y="126" font-size="15" fill="#62718a" font-weight="600" >LATER ACTIVITY</text><text x="802" y="126" font-size="15" fill="#62718a" font-weight="600" >STATE AND MANUAL RESTORE</text><rect x="40" y="146" width="260" height="178" rx="18" fill="#eef5ff" stroke="#ccddf4"/><rect x="340" y="146" width="400" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><rect x="780" y="146" width="460" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><path d="M310 235h20m-7-6 7 6-7 6 M750 235h20m-7-6 7 6-7 6" fill="none" stroke="#929db0" stroke-width="2"/><text x="60" y="188" font-size="25" fill="#2866ad" font-weight="650" >Hide pet</text><text x="60" y="228" font-size="18" fill="#24324a" font-weight="400" >Window hides; tray stays</text><text x="60" y="261" font-size="17" fill="#62718a" font-weight="400" >Hidden preference is saved</text><text x="362" y="189" font-size="20" fill="#24324a" font-weight="400" >Work-state changes</text><text x="362" y="229" font-size="20" fill="#24324a" font-weight="400" >New chat connections</text><text x="362" y="269" font-size="20" fill="#24324a" font-weight="400" >Codex restarts or reconnects</text><text x="802" y="188" font-size="23" fill="#2866ad" font-weight="650" >Stays hidden; no pop-ups</text><text x="802" y="228" font-size="18" fill="#24324a" font-weight="400" >Click the tray icon or choose Show pet</text><text x="802" y="264" font-size="18" fill="#24324a" font-weight="400" >Or run pnpm desktop:start</text><rect x="40" y="358" width="260" height="178" rx="18" fill="#f6effc" stroke="#e0d1ef"/><rect x="340" y="358" width="400" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><rect x="780" y="358" width="460" height="178" rx="18" fill="#fff" stroke="#dfe4ed"/><path d="M310 447h20m-7-6 7 6-7 6 M750 447h20m-7-6 7 6-7 6" fill="none" stroke="#929db0" stroke-width="2"/><text x="60" y="400" font-size="25" fill="#7852a4" font-weight="650" >Exit pet</text><text x="60" y="440" font-size="18" fill="#24324a" font-weight="400" >Window and tray close</text><text x="60" y="473" font-size="17" fill="#62718a" font-weight="400" >Exit preference is saved</text><text x="362" y="401" font-size="20" fill="#24324a" font-weight="400" >Work-state changes</text><text x="362" y="441" font-size="20" fill="#24324a" font-weight="400" >New chat connections</text><text x="362" y="481" font-size="20" fill="#24324a" font-weight="400" >Codex restarts or reconnects</text><text x="802" y="400" font-size="23" fill="#7852a4" font-weight="650" >Stays closed; no automatic launch</text><text x="802" y="440" font-size="18" fill="#24324a" font-weight="400" >Reopen manually from the project:</text><text x="802" y="476" font-size="18" fill="#24324a" font-weight="400" font-family="Consolas,monospace">pnpm desktop:start</text><text x="40" y="582" font-size="17" fill="#62718a" font-weight="400" >An explicit install or update also opens the pet.</text></g></svg>